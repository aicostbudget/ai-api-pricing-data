name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Checkout Website public pricing source
        uses: actions/checkout@v5
        with:
          repository: linqiang-max/aicostbudget
          ref: main
          path: website-source
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Website dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: website-source
      - name: Build generated data
        run: python scripts/build.py --output-root "$RUNNER_TEMP/pricing-build"
      - name: Validate dataset
        run: python scripts/validate.py
      - name: Check Hugging Face export parity with Website
        run: python scripts/export_huggingface.py --website-repo website-source --website-ref HEAD --check
      - name: Run tests
        run: python -m unittest discover -s tests



