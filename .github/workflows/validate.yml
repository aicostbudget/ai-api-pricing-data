name: Validate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      website_candidate_sha:
        description: "Optional exact reviewed Website candidate SHA"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Checkout Website public pricing source
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v5
        with:
          repository: linqiang-max/aicostbudget
          ref: ${{ inputs.website_candidate_sha || 'main' }}
          path: website-source
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Website dependencies
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: website-source
      - name: Build generated data
        run: python scripts/build.py --output-root "$RUNNER_TEMP/pricing-build"
      - name: Validate dataset
        run: python scripts/validate.py
      - name: Run complete development suite once
        run: python -m unittest discover -s tests
      - name: Compare Website serializer with downloadable records
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/test-dataset-pricing-components-parity.mjs ../huggingface
        working-directory: website-source
