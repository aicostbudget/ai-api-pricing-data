name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Checkout Website public pricing source
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: actions/checkout@v5
        with:
          repository: linqiang-max/aicostbudget
          ref: main
          path: website-source
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Website dependencies
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: website-source
      - name: Build generated data
        run: python scripts/build.py --output-root "$RUNNER_TEMP/pricing-build"
      - name: Validate dataset
        run: python scripts/validate.py
      - name: Run tests
        run: python -m unittest discover -s tests



