name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      website_candidate_sha:
        description: "Exact reviewed Website candidate SHA; empty validates published main"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: ${{ inputs.website_candidate_sha == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Checkout Website public pricing source
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          repository: linqiang-max/aicostbudget
          ref: main
          path: website-source
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Website dependencies
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: website-source
      - name: Build generated data
        run: python scripts/build.py --output-root "$RUNNER_TEMP/pricing-build"
      - name: Validate dataset
        run: python scripts/validate.py
      - name: Run tests
        run: python -m unittest discover -s tests




  reviewed-website-candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.website_candidate_sha != '' }}
    environment: pricing-candidate-review
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify protected candidate checkout policy
        env:
          WEBSITE_CANDIDATE_SHA: ${{ inputs.website_candidate_sha }}
          WEBSITE_REPO_TOKEN: ${{ secrets.WEBSITE_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_website_candidate.py
      - name: Checkout Website public pricing source
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          repository: linqiang-max/aicostbudget
          ref: ${{ inputs.website_candidate_sha }}
          path: website-source
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Website dependencies
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: website-source
      - name: Build generated data
        run: python scripts/build.py --output-root "$RUNNER_TEMP/pricing-build"
      - name: Validate dataset
        run: python scripts/validate.py
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Compare actual Website serializer with HF downloadable records
        run: node scripts/test-dataset-pricing-components-parity.mjs ../huggingface
        working-directory: website-source
