name: Hugging Face Safe Publish

on:
  workflow_dispatch:
    inputs:
      recovery_mode:
        description: "Forward Recovery only"
        required: false
        type: boolean
        default: false
      recovery_source_sha:
        required: false
        type: string
      recovery_artifact_sha:
        required: false
        type: string
      recovery_website_sha:
        required: false
        type: string
      recovery_id:
        required: false
        type: string
      recovery_digest:
        required: false
        type: string
      dry_run:
        description: "Forward Recovery preflight only"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hugging-face-production-publish
  cancel-in-progress: false

env:
  HF_REPO_ID: aicostbudget-ai/ai-api-pricing

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: hf-release-review
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.recovery_mode && inputs.recovery_artifact_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Checkout Website public pricing source
        uses: actions/checkout@v5
        with:
          repository: linqiang-max/aicostbudget
          ref: ${{ inputs.recovery_mode && inputs.recovery_website_sha || 'main' }}
          path: website-source
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          persist-credentials: false
      - name: Verify explicit Forward Recovery identity
        if: inputs.recovery_mode
        env:
          RECOVERY_SOURCE_SHA: ${{ inputs.recovery_source_sha }}
          RECOVERY_ARTIFACT_SHA: ${{ inputs.recovery_artifact_sha }}
          RECOVERY_WEBSITE_SHA: ${{ inputs.recovery_website_sha }}
          RECOVERY_ID: ${{ inputs.recovery_id }}
          RECOVERY_DIGEST: ${{ inputs.recovery_digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_release_gate.py --kind hf --recovery
      - name: Build Hugging Face source once
        env:
          SOURCE_COMMIT_SHA: ${{ inputs.recovery_mode && inputs.recovery_source_sha || github.sha }}
        run: |
          GENERATED_AT=$(git show -s --format=%cI "${{ inputs.recovery_mode && inputs.recovery_artifact_sha || github.sha }}" | xargs -I{} date -u -d {} +%Y-%m-%dT%H:%M:%SZ)
          python scripts/build.py --generated-at "$GENERATED_AT"
          python scripts/generate_pricing_v2_preview.py
          python scripts/export_huggingface.py --website-repo website-source --website-ref "${{ inputs.recovery_mode && inputs.recovery_website_sha || 'main' }}" --generated-at "$GENERATED_AT" --write
      - name: Validate allowlisted Hugging Face artifacts
        run: python -m unittest tests.test_huggingface_export
      - name: Require Hugging Face write token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "AUTH_FAILURE: HF_TOKEN is not configured" >&2
            exit 1
          fi
      - name: Publish allowlisted artifacts safely
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_SOURCE_SHA: ${{ inputs.recovery_mode && inputs.recovery_source_sha || github.sha }}
        run: ${{ inputs.recovery_mode && inputs.dry_run && 'python scripts/publish_huggingface.py --dry-run' || 'python scripts/publish_huggingface.py' }}
      - name: Verify Hugging Face production parity
        if: ${{ ! inputs.recovery_mode || ! inputs.dry_run }}
        run: python scripts/check_hf_production_parity.py
