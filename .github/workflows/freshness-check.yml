name: Freshness Check

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: freshness-check-issue-lifecycle
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build generated data
        run: python scripts/build.py
      - name: Generate freshness report
        id: freshness
        continue-on-error: true
        run: python scripts/validate.py --freshness-report --max-age-days 30 --check-urls
      - uses: actions/upload-artifact@v6
        with:
          name: freshness-report
          path: freshness-report.md
      - name: Manage freshness issue lifecycle
        if: always() && (steps.freshness.outcome == 'success' || steps.freshness.outcome == 'failure')
        uses: actions/github-script@v8
        env:
          FRESHNESS_OUTCOME: ${{ steps.freshness.outcome }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const { manageFreshnessIssue } = require(
              path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/freshness-issue-lifecycle.js")
            );
            const reportPath = path.join(process.env.GITHUB_WORKSPACE, "freshness-report.md");
            const reportBody = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, "utf8")
              : "# Freshness Report\n\nThe workflow did not produce freshness-report.md.";
            await manageFreshnessIssue({
              github,
              context,
              reportBody,
              freshnessFailed: process.env.FRESHNESS_OUTCOME === "failure"
            });
