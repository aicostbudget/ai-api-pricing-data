name: Packages

on:
  pull_request:
    paths:
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/packages.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run build:mcpb
      - run: npm run test:mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: ai-api-pricing-mcpb
          path: dist-mcpb/*.mcpb
          if-no-files-found: error
