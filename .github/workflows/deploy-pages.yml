name: Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      recovery_mode:
        description: "Forward Recovery only"
        required: false
        type: boolean
        default: false
      recovery_source_sha:
        required: false
        type: string
      recovery_artifact_sha:
        required: false
        type: string
      recovery_website_sha:
        required: false
        type: string
      recovery_id:
        required: false
        type: string
      recovery_digest:
        required: false
        type: string

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' || inputs.recovery_mode
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.recovery_mode && inputs.recovery_artifact_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify explicit Forward Recovery identity
        if: inputs.recovery_mode
        env:
          RECOVERY_SOURCE_SHA: ${{ inputs.recovery_source_sha }}
          RECOVERY_ARTIFACT_SHA: ${{ inputs.recovery_artifact_sha }}
          RECOVERY_WEBSITE_SHA: ${{ inputs.recovery_website_sha }}
          RECOVERY_ID: ${{ inputs.recovery_id }}
          RECOVERY_DIGEST: ${{ inputs.recovery_digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_release_gate.py --kind pages --recovery
      - name: Build public API once
        env:
          SOURCE_COMMIT_SHA: ${{ inputs.recovery_mode && inputs.recovery_source_sha || github.sha }}
        run: python scripts/build.py
      - name: Validate public API
        run: python scripts/validate.py
      - name: Prepare allowlisted Pages artifact
        run: python scripts/prepare_pages_artifact.py pages-dist --release-sha "${{ inputs.recovery_mode && inputs.recovery_source_sha || github.sha }}"
      - uses: actions/configure-pages@v6
        with:
          enablement: false
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist
      - name: Deploy approved Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify public Pages revision and parity
        run: python scripts/verify_pages_deployment.py --release-sha "${{ inputs.recovery_mode && inputs.recovery_source_sha || github.sha }}"
