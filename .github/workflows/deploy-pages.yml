name: Deploy Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.artifact.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate static dataset
        run: python scripts/validate.py
      - name: Prepare Pages artifact
        id: artifact
        run: python scripts/prepare_pages_artifact.py pages-dist --artifact-sha "${{ github.sha }}" --github-output "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "pages-dist"
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify public Pages deployment
        run: python scripts/verify_pages_deployment.py --expected-source-sha "${{ needs.build.outputs.source_sha }}" --artifact-sha "${{ github.sha }}"
