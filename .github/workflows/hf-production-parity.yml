name: Hugging Face Production Parity

on:
  schedule:
    - cron: "29 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-production-parity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-hf-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compare approved artifacts with Hugging Face production
        run: python scripts/check_hf_production_parity.py
